<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rumbo Conductor — Mercado Pago</title>
<style>
  body { margin: 0; background: #F2F4F5; color: #101A20; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
         display: flex; justify-content: center; padding: 48px 16px; }
  .card { background: #fff; border: 1px solid #DCE6E9; border-radius: 16px; padding: 28px 22px; max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #55666D; font-size: 16px; line-height: 1.5; margin: 0; }
  .ok { color: #0B7A4B; }
  .error { color: #B42318; }
</style>
</head>
<body>
<div class="card">
  <h1 id="titulo">Vinculando tu Mercado Pago...</h1>
  <p id="detalle">Un momento.</p>
</div>
<script>
/* Página a la que Mercado Pago devuelve al conductor después de autorizar
   (redirect_uri registrada en la aplicación de TToLabs). No guarda nada: le
   pasa el code y el state al backend, que es quien canjea el code por los
   tokens y valida que el state lo haya generado ese mismo conductor. */
(function () {
  var API_URL = "https://script.google.com/macros/s/AKfycbwMr2YGxsGkz2RarJ1kCbAgmQMp10VHXvKjKwXJjEE01Py7tggqN3DK4XibnXpAjEMb/exec";
  var titulo = document.getElementById("titulo");
  var detalle = document.getElementById("detalle");
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code"), state = params.get("state");

  function mostrar(ok, t, d) {
    titulo.textContent = t;
    titulo.className = ok ? "ok" : "error";
    detalle.textContent = d;
  }

  if (!code || !state) {
    mostrar(false, "No se completó la vinculación",
      "Mercado Pago no devolvió la autorización. Vuelve a la app Rumbo Conductor → Ajustes e inténtalo de nuevo.");
    return;
  }

  // Se saca el code de la barra de direcciones: es de un solo uso, pero no
  // tiene sentido dejarlo en el historial del navegador.
  history.replaceState(null, "", window.location.pathname);

  fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: "mp_completar_vinculacion", code: code, state: state }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.ok) {
        mostrar(true, "¡Listo! Tu Mercado Pago quedó vinculado",
          "Ya puedes cerrar esta pestaña y volver a Rumbo Conductor. Desde ahora puedes cobrar tus viajes por Mercado Pago.");
      } else {
        mostrar(false, "No se pudo vincular", res.error + ".");
      }
    })
    .catch(function () {
      mostrar(false, "No se pudo vincular", "Hubo un problema de conexión. Vuelve a intentarlo desde Ajustes.");
    });
})();
</script>
</body>
</html>
