<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Seguimiento de viaje — Rumbo</title>
<!-- Página pública, SIN login: la comparte un pasajero de Rumbo para que
     alguien sin la app (o sin cuenta) vea el auto en vivo. No vive dentro
     de la app compilada — se hostea junto al resto del mirror público en
     GitHub Pages (rumbo-web). Nunca expone datos del pasajero, solo lo
     necesario para seguir el viaje: ver seguimientoPublico() en el backend. -->
<style>
  :root {
    --bg: #F2F4F5; --surface: #FFFFFF; --surface-2: #F4F8F9;
    --border: #DCE6E9; --text: #101A20; --text-2: #55666D; --text-3: #859097;
    --primary: #0A1F44; --primary-ink: #FFFFFF;
    --accent: #0B7A4B; --accent-soft: #E6F4ED;
    --warn: #9A6B00; --warn-soft: #FBF1DC;
    --danger: #B3392B; --danger-soft: #FBEDEB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    background: var(--primary); color: var(--primary-ink);
    padding: 18px 16px; font-size: 17px; font-weight: 700;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  #mapa { width: 100%; height: 320px; border-radius: 12px; background: var(--surface-2); }
  .estado {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; margin-bottom: 10px;
  }
  .estado.pendiente { background: var(--warn-soft); color: var(--warn); }
  .estado.confirmado { background: var(--accent-soft); color: var(--accent); }
  .estado.completado { background: var(--surface-2); color: var(--text-2); }
  .estado.error { background: var(--danger-soft); color: var(--danger); }
  .ruta-linea { font-size: 14.5px; margin: 4px 0; }
  .ruta-linea b { color: var(--text-3); font-weight: 600; }
  .conductor { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .conductor-nombre { font-weight: 700; font-size: 15px; }
  .conductor-auto { font-size: 13.5px; color: var(--text-2); }
  .nota { font-size: 13px; color: var(--text-3); text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
  <header>Rumbo — Seguimiento de viaje</header>
  <main>
    <div class="card">
      <span class="estado pendiente" id="estado">Cargando...</span>
      <div class="ruta-linea"><b>Desde:</b> <span id="origen">—</span></div>
      <div class="ruta-linea"><b>Hasta:</b> <span id="destino">—</span></div>
      <div class="conductor" id="conductorInfo" style="display:none;">
        <div>
          <div class="conductor-nombre" id="conductorNombre"></div>
          <div class="conductor-auto" id="conductorAuto"></div>
        </div>
      </div>
    </div>
    <div class="card" id="cardMapa" style="display:none;">
      <div id="mapa"></div>
    </div>
    <p class="nota" id="notaVacia" style="display:none;">Este link de seguimiento ya no está disponible (el viaje terminó hace tiempo o el link es incorrecto).</p>
  </main>

<script>
(function () {
  var API_URL = "https://script.google.com/macros/s/AKfycbwMr2YGxsGkz2RarJ1kCbAgmQMp10VHXvKjKwXJjEE01Py7tggqN3DK4XibnXpAjEMb/exec";
  var GOOGLE_MAPS_JS_KEY = "AIzaSyBvkEjQdOsFN7CM2EpRXoY5iuh-OgA6js4";
  var token = new URLSearchParams(window.location.search).get("t");

  var mapa = null, marcadorAuto = null, linea = null, googleListo = false;

  function cargarGoogleMaps() {
    if (window.google && window.google.maps) { googleListo = true; return; }
    var script = document.createElement("script");
    script.src = "https://maps.googleapis.com/maps/api/js?key=" + GOOGLE_MAPS_JS_KEY + "&libraries=geometry&callback=alGoogleMapsListo";
    document.head.appendChild(script);
  }
  // Mismas piezas visuales que las apps: mapa limpio, ruta naranja con borde
  // y auto visto desde arriba que gira hacia donde avanza.
  var ESTILO_MAPA = [
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "transit", stylers: [{ visibility: "off" }] },
    { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] }
  ];
  /* Mapa de DÍA y de NOCHE según la hora real (altura del sol en el lugar). */
  var ESTILO_MAPA_NOCHE = ESTILO_MAPA.concat([
    { elementType: "geometry", stylers: [{ color: "#17212B" }] },
    { elementType: "labels.text.fill", stylers: [{ color: "#9FB3C8" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#0F1720" }] },
    { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#34495C" }] },
    { featureType: "landscape", elementType: "geometry", stylers: [{ color: "#1B2733" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#2E3F52" }] },
    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#A9BACB" }] },
    { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#385068" }] },
    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#4A6B8A" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#0B1824" }] },
    { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#5C7C99" }] }
  ]);
  function alturaDelSol(fecha, lat, lng) {
    var rad = Math.PI / 180;
    var dia = (fecha.getTime() - Date.UTC(fecha.getUTCFullYear(), 0, 1)) / 86400000;
    var g = 2 * Math.PI / 365 * (dia - 0.5);
    var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var minutosUTC = fecha.getUTCHours() * 60 + fecha.getUTCMinutes() + fecha.getUTCSeconds() / 60;
    var angulo = ((minutosUTC + eq + 4 * lng) / 4 - 180) * rad;
    var cz = Math.sin(lat * rad) * Math.sin(decl) + Math.cos(lat * rad) * Math.cos(decl) * Math.cos(angulo);
    return 90 - Math.acos(Math.max(-1, Math.min(1, cz))) / rad;
  }
  function esDeNoche(fecha, lat, lng) { return alturaDelSol(fecha, lat, lng) < -3; }
  function estiloMapaActual() { return esDeNoche(new Date(), -33.45, -70.66) ? ESTILO_MAPA_NOCHE : ESTILO_MAPA; }
  setInterval(function () { try { if (mapa) mapa.setOptions({ styles: estiloMapaActual() }); } catch (e) {} }, 120000);
  function iconoAuto(rumbo) {
    var r = Math.round((rumbo || 0) / 5) * 5;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">' +
      '<g transform="rotate(' + r + ' 28 28)">' +
      '<ellipse cx="29" cy="30" rx="12" ry="21" fill="rgba(0,0,0,0.22)"/>' +
      '<rect x="17" y="7" width="22" height="42" rx="9" fill="#16333F" stroke="#FFFFFF" stroke-width="2.5"/>' +
      '<path d="M20.5 17 Q28 12.5 35.5 17 L34 23 Q28 21 22 23 Z" fill="#9BD4F5"/>' +
      '<rect x="21.5" y="24.5" width="13" height="12" rx="3" fill="#2B5468"/>' +
      '<path d="M22 38.5 Q28 40.5 34 38.5 L35.2 43 Q28 45.5 20.8 43 Z" fill="#9BD4F5"/>' +
      '<circle cx="21" cy="10" r="1.7" fill="#FFE29A"/><circle cx="35" cy="10" r="1.7" fill="#FFE29A"/>' +
      '<rect x="19" y="46" width="4" height="1.8" rx=".9" fill="#F87171"/><rect x="33" y="46" width="4" height="1.8" rx=".9" fill="#F87171"/>' +
      '</g></svg>';
    return { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg), scaledSize: new google.maps.Size(56, 56), anchor: new google.maps.Point(28, 28) };
  }
  function moverAuto(marcador, pos) {
    var antes = marcador.getPosition();
    if (antes && google.maps.geometry) {
      var ahora = new google.maps.LatLng(pos.lat, pos.lng);
      if (google.maps.geometry.spherical.computeDistanceBetween(antes, ahora) > 4) {
        marcador.setIcon(iconoAuto(google.maps.geometry.spherical.computeHeading(antes, ahora)));
      }
    }
    marcador.setPosition(pos);
  }

  window.alGoogleMapsListo = function () {
    googleListo = true;
    mapa = new google.maps.Map(document.getElementById("mapa"), {
      zoom: 13, center: { lat: -33.45, lng: -70.66 }, disableDefaultUI: true, zoomControl: true, styles: estiloMapaActual()
    });
  };

  function dibujarRuta(polilinea) {
    if (!mapa || linea || !polilinea || !google.maps.geometry) return;
    var puntos = google.maps.geometry.encoding.decodePath(polilinea);
    if (!puntos.length) return;
    new google.maps.Polyline({ map: mapa, path: puntos, strokeColor: "#9A3412", strokeOpacity: 0.45, strokeWeight: 10, zIndex: 1 });
    linea = new google.maps.Polyline({ map: mapa, path: puntos, strokeColor: "#F97316", strokeOpacity: 1, strokeWeight: 6, zIndex: 2 });
    var limites = new google.maps.LatLngBounds();
    puntos.forEach(function (p) { limites.extend(p); });
    mapa.fitBounds(limites, 30);
  }

  // Origen (verde), paradas numeradas (ámbar) y destino (oscuro).
  var marcadoresPuntos = [], puntosPintados = "";
  function dibujarPuntos(puntos) {
    if (!mapa || !puntos || puntos.length < 2) return;
    var clave = JSON.stringify(puntos);
    if (clave === puntosPintados) return;
    puntosPintados = clave;
    marcadoresPuntos.forEach(function (m) { m.setMap(null); });
    marcadoresPuntos = [];
    puntos.forEach(function (pt, i) {
      var esOrigen = i === 0, esDestino = i === puntos.length - 1;
      var op = {
        map: mapa, position: { lat: pt.lat, lng: pt.lng }, zIndex: 0,
        title: esOrigen ? "Salida" : esDestino ? "Destino" : "Parada " + i,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: esOrigen || esDestino ? 8 : 11,
          fillColor: esOrigen ? "#16A34A" : esDestino ? "#16333F" : "#B45309", fillOpacity: 1, strokeColor: "#FFFFFF", strokeWeight: 2.5 }
      };
      if (!esOrigen && !esDestino) op.label = { text: String(i), color: "#FFFFFF", fontWeight: "700", fontSize: "12px" };
      marcadoresPuntos.push(new google.maps.Marker(op));
    });
  }

  function pintar(res) {
    if (!res.ok) {
      document.getElementById("estado").className = "estado error";
      document.getElementById("estado").textContent = "No disponible";
      document.getElementById("notaVacia").style.display = "block";
      document.querySelector(".card").style.display = "none";
      return;
    }
    document.getElementById("origen").textContent = res.origen || "—";
    document.getElementById("destino").textContent = res.destino || "—";
    var estadoEl = document.getElementById("estado");
    var etiquetas = { PENDIENTE: ["Buscando conductor", "pendiente"], CONFIRMADO: ["Viaje en curso", "confirmado"], COMPLETADO: ["Viaje terminado", "completado"], SIN_CONDUCTOR: ["No se pudo asignar un conductor", "error"], CANCELADO: ["Viaje cancelado", "error"] };
    var e = etiquetas[res.estado] || [res.estado, "pendiente"];
    // Diferencia "va a buscar al pasajero" de "ya van en viaje".
    if (res.estado === "CONFIRMADO") {
      // Viaje agendado: hasta 1 hora antes es "confirmado", no "va a buscarlo".
      var agendadoLejos = !res.viaje_iniciado && res.para_ahora === false && Number(res.viaje_ms) - Date.now() > 60 * 60 * 1000;
      var cuando = "";
      if (agendadoLejos) {
        var dv = new Date(Number(res.viaje_ms));
        cuando = dv.toLocaleDateString("es-CL", { weekday: "short", day: "2-digit", month: "2-digit" }) + " " +
          dv.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
      }
      e = [res.viaje_iniciado ? "En viaje" : agendadoLejos ? "Viaje confirmado para " + cuando : "El conductor va a buscar al pasajero", "confirmado"];
    }
    estadoEl.textContent = e[0];
    estadoEl.className = "estado " + e[1];

    if (res.conductor) {
      document.getElementById("conductorInfo").style.display = "flex";
      document.getElementById("conductorNombre").textContent = "Conductor: " + res.conductor.nombre;
      var auto = [res.conductor.vehiculo_marca, res.conductor.vehiculo_modelo, res.conductor.vehiculo_color].filter(Boolean).join(" · ");
      if (res.conductor.vehiculo_patente) auto += (auto ? " — " : "") + res.conductor.vehiculo_patente;
      document.getElementById("conductorAuto").textContent = auto;
    }

    if (res.estado === "CONFIRMADO") {
      document.getElementById("cardMapa").style.display = "block";
      cargarGoogleMaps();
      var intento = function () {
        if (!googleListo) { setTimeout(intento, 400); return; }
        dibujarRuta(res.polilinea);
        dibujarPuntos(res.puntos);
        if (res.ubicacion) {
          var pos = { lat: Number(res.ubicacion.lat), lng: Number(res.ubicacion.lng) };
          if (!marcadorAuto) marcadorAuto = new google.maps.Marker({ map: mapa, icon: iconoAuto(0), zIndex: 3 });
          moverAuto(marcadorAuto, pos);
          if (!linea) mapa.setCenter(pos);
        }
      };
      intento();
    }

    // Deja de sondear cuando ya no tiene sentido: viaje terminado o no asignado.
    if (res.estado === "COMPLETADO" || res.estado === "SIN_CONDUCTOR" || res.estado === "CANCELADO") clearInterval(sondeo);
  }

  function consultar() {
    fetch(API_URL + "?accion=seguimiento_publico&t=" + encodeURIComponent(token || ""))
      .then(function (r) { return r.json(); })
      .then(pintar)
      .catch(function () { /* reintenta en el próximo sondeo */ });
  }

  if (!token) {
    pintar({ ok: false });
  } else {
    consultar();
    var sondeo = setInterval(consultar, 5000);
  }
})();
</script>
</body>
</html>
